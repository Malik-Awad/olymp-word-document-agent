[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "olymp-doc-agent"
version = "0.1.0"
description = "LangGraph agent for precise Microsoft Word document edits"
requires-python = ">=3.11"
dependencies = [
  "langgraph>=0.2.0,<1.0",
  "python-docx>=1.1.0,<2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
]

[project.scripts]
doc-agent = "olymp_doc_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

